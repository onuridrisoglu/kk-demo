apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kits-demo
spec:
  parentRefs:
    - name: public-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kits-demo-stable
          port: 80
          weight: 100
        - name: kits-demo-canary
          port: 80
          weight: 0
      sessionPersistence:
        sessionName: vaadin-session
        type: Cookie
