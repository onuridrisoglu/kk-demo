apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kits-demo
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kits-demo
  template:
    metadata:
      labels:
        app: kits-demo
    spec:
      containers:
        - name: kits-demo
          image: onurvaadin/kits-demo:3.3
          env:
            - name: APP_VERSION
              value: "3.3"
            - name: DB_HOSTNAME
              value: postgres-db-rw
            - name: REDIS_HOST
              value: redis-service
            - name: VAADIN_KUBERNETES_ROLLING_UPDATES
              value: "true"
            - name: VAADIN_KUBERNETES_STICKY_SESSION_COOKIE_NAME
              value: "vaadin-session"
            - name: VAADIN_KUBERNETES_CLUSTER_KEY_COOKIE_NAME
              value: "clusterKey"
            - name: VAADIN_KUBERNETES_UPDATE_VERSION_HEADER_NAME
              value: "X-AppUpdate"
            - name: VAADIN_SUBSCRIPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: vaadin-subscription-key
                  key: subscriptionKey
          ports:
            - name: http
              containerPort: 8081
  strategy:
    canary:
      canaryService: kits-demo-canary
      stableService: kits-demo-stable
      trafficRouting:
        nginx:
          stableIngress: kits-demo-stable
      steps:
        - setWeight: 1     # spin up canary pods, but send no traffic to them yet
        - pause: {}         # verify v2 on canary service, then promote manually
        - setWeight: 100    # all new sessions → v2, existing v1 sessions stay via sticky cookie
        - pause: {}         # notify v1 users via X-AppUpdate header, wait for drain
