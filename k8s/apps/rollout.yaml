apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kits-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kits-demo
  template:
    metadata:
      labels:
        app: kits-demo
    spec:
      containers:
        - name: kits-demo
          image: onurvaadin/kits-demo:1.0
          env:
            - name: APP_VERSION
              value: "1.0"
            - name: DB_HOSTNAME
              value: postgres-db-rw
            - name: VAADIN_KUBERNETES_ROLLING_UPDATES
              value: "true"
            - name: VAADIN_KUBERNETES_STICKY_SESSION_COOKIE_NAME
              value: "vaadin-session"
            - name: VAADIN_KUBERNETES_CLUSTER_KEY_COOKIE_NAME
              value: "clusterKey"
            - name: VAADIN_KUBERNETES_UPDATE_VERSION_HEADER_NAME
              value: "X-AppUpdate"
            - name: VAADIN_SUBSCRIPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: vaadin-subscription-key
                  key: subscriptionKey
          ports:
            - name: http
              containerPort: 8081
  strategy:
    canary:
      canaryService: kits-demo-canary
      stableService: kits-demo-stable
      trafficRouting:
        nginx:
          stableIngress: kits-demo-stable
      steps:
        - setWeight: 20     # spin up canary pods, 20% of new traffic for verification
        - pause: {}         # 1) verify v2  2) apply X-AppUpdate annotation → notify v1 users → wait for drain
        - setWeight: 100    # v1 drained → all sessions go to v2, complete rollout
